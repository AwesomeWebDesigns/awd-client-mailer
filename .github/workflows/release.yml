# Builds awd-client-mailer.zip and attaches it to each published GitHub release.
# Client sites install this zip when they update the plugin.
name: Build release zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the release tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' awd-client-mailer.php | awk '{print $NF}')
          STABLE=$(grep -m1 -E '^Stable tag:' readme.txt | awk '{print $NF}')
          echo "Tag: $TAG | Plugin header: $HEADER | readme.txt stable tag: $STABLE"
          if [ "$TAG" != "$HEADER" ]; then
            echo "::error::The release tag (v$TAG) does not match the Version in awd-client-mailer.php ($HEADER)."
            exit 1
          fi
          if [ "$TAG" != "$STABLE" ]; then
            echo "::warning::readme.txt Stable tag ($STABLE) does not match the release ($TAG)."
          fi

      - name: Build the plugin zip
        run: git archive --format=zip --prefix=awd-client-mailer/ -o awd-client-mailer.zip HEAD

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" awd-client-mailer.zip --clobber
